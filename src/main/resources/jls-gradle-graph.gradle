// Read Java source sets and project edges without executing compilation tasks.
// One task per project: reading another project's model is deprecated (and fails under isolated
// projects), and parallel builds interleave stdout, so each project writes its own file.
gradle.allprojects { proj ->
    proj.tasks.register('jlsModuleGraph') {
        doLast {
            def outputDir = proj.findProperty('jls.outputDir')
            if (outputDir == null) throw new GradleException('jls.outputDir not set')
            def projectDependencies = { configurationName ->
                def config = proj.configurations.findByName(configurationName)
                if (config == null) return []
                config.allDependencies.findAll { it instanceof org.gradle.api.artifacts.ProjectDependency }
                    .collect { dep ->
                        try { dep.path } catch (MissingPropertyException ignored) { dep.dependencyProject.path }
                    }.unique()
            }
            def sourceDirs = [], testSourceDirs = [], moduleDeps = [], testModuleDeps = []
            def mainOutput = null, testOutput = null, release = null
            def sets = proj.extensions.findByName('sourceSets')
            if (sets != null) {
                sets.each { sourceSet ->
                    def dirs = sourceSet.java.srcDirs.collect { it.absolutePath }
                    def compile = proj.tasks.findByName(sourceSet.compileJavaTaskName)
                    if (compile instanceof org.gradle.api.tasks.compile.JavaCompile) {
                        def generated = compile.options.generatedSourceOutputDirectory.orNull
                        if (generated != null) dirs.add(generated.asFile.absolutePath)
                        def output = compile.destinationDirectory.orNull?.asFile?.absolutePath
                        if (sourceSet.name == 'main') {
                            mainOutput = output
                            release = compile.options.release.orNull?.toString() ?: compile.sourceCompatibility
                        } else if (sourceSet.name == 'test') testOutput = output
                    }
                    sourceDirs.addAll(dirs)
                    def deps = projectDependencies(sourceSet.compileClasspathConfigurationName)
                    if (sourceSet.name == 'main') moduleDeps.addAll(deps)
                    else { testSourceDirs.addAll(dirs); testModuleDeps.addAll(deps) }
                }
            }
            def json = groovy.json.JsonOutput.toJson(
                    [projectPath: proj.path, projectDir: proj.projectDir.absolutePath,
                     sourceDirs: sourceDirs.unique(), testSourceDirs: testSourceDirs.unique(),
                     classOutputDir: mainOutput, testOutputDir: testOutput,
                     moduleDeps: moduleDeps.unique(), testModuleDeps: (moduleDeps + testModuleDeps).unique(),
                     sourceCompatibility: release, externalClasspath: []])
            new File(outputDir as String, proj.path.replace(':', '_') + '.json').text = json
        }
    }
}
