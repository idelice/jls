// Resolve available external artifacts. Project artifacts are represented by source roots.
// Each project resolves only its OWN configurations: Gradle grants the required lock to the
// owning project, and cross-project resolution is forbidden. Results go to one file per project
// because parallel builds interleave stdout.
gradle.allprojects { proj ->
    proj.tasks.register('jlsResolveClasspath') {
        doLast {
            def outputDir = proj.findProperty('jls.outputDir')
            if (outputDir == null) throw new GradleException('jls.outputDir not set')
            def externalFiles = { sourceSet ->
                def config = proj.configurations.findByName(sourceSet.compileClasspathConfigurationName)
                if (config == null || !config.canBeResolved) return []
                def artifacts = config.incoming.artifactView {
                    lenient = true
                    componentFilter { !(it instanceof org.gradle.api.artifacts.component.ProjectComponentIdentifier) }
                }.artifacts
                artifacts.failures.each { System.err.println("[jls-gradle] partial ${proj.path}: ${it.message}") }
                artifacts.artifactFiles.files.collect { it.absolutePath }
            }
            def main = [], test = []
            def sets = proj.extensions.findByName('sourceSets')
            if (sets != null) sets.each { sourceSet ->
                def files = externalFiles(sourceSet)
                if (sourceSet.name == 'main') main.addAll(files)
                else test.addAll(files)
            }
            def json = groovy.json.JsonOutput.toJson([projectPath: proj.path,
                    externalClasspath: main.unique(), testClasspath: (main + test).unique()])
            new File(outputDir as String, proj.path.replace(':', '_') + '.json').text = json
        }
    }
}
